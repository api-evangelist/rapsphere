description: RAPsphere was a mobile IT company that developed mobile information management solutions
  enabling CIOs to contend with BYOD (bring-your-own-device) in the enterprise and the critical need to
  protect corporate applications and data on mobile devices. Backed by Lightspeed Venture Partners, the
  company was acquired by AppSense in May 2012 and no longer operates as an independent entity. Its former
  domain (rapsphere.com) is now a parked / for-sale domain and there is no live developer surface, public
  API, documentation, or reachable web presence to enrich. This profile is retained as a portfolio-history
  lead and is not an active API provider.
